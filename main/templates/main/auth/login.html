{% extends "main/base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Вхід в систему</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-buy">Увійти</button>
    </form>
    <div class="auth-links">
        <a href="{% url 'register' %}" class="inline-link">Ще не зареєстровані?</a> | 
        <a href="{% url 'password_reset' %}" class="inline-link">Забули пароль?</a>
    </div>
</div>
{% endblock %}
