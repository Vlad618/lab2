{% extends "main/base.html" %}

{% block title %}Новий пароль{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Введіть новий пароль</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-buy" style="margin-top: 20px; width: 100%;">Змінити пароль</button>
    </form>
</div>
{% endblock %}
