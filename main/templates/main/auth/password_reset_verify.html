{% extends "main/base.html" %}

{% block title %}Введіть код{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Підтвердження коду</h2>
    <p>Ми надіслали 6-значний код на вашу пошту. Будь ласка, введіть його нижче.</p>
    
    {% if error %}
        <p style="color: #ef4444; margin-bottom: 15px;">{{ error }}</p>
    {% endif %}

    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-group">
            <input type="text" name="code" placeholder="000000" maxlength="6" required class="form-input" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
        </div>
        <button type="submit" class="btn btn-buy" style="margin-top: 20px; width: 100%;">Підтвердити</button>
    </form>
    
    <div class="auth-links">
        <a href="{% url 'password_reset' %}" class="inline-link">Надіслати код повторно</a>
    </div>
</div>
{% endblock %}
