{% extends "main/base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Реєстрація</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-buy">Зареєструватися</button>
    </form>
    <div class="auth-links">
        <a href="{% url 'login' %}" class="inline-link">Вже маєте акаунт? Увійти</a>
    </div>
</div>
{% endblock %}
